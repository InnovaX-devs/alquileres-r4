# ==========================================
# Configuración de producción (issue #90)
# Se activa con SPRING_PROFILES_ACTIVE=prod (ya viene en el Dockerfile).
# No lleva secretos: todo sale de variables de entorno cargadas en Render.
# ==========================================

# Render indica el puerto en la variable PORT
server.port=${PORT:8080}
spring.application.name=app
spring.thymeleaf.check-template-location=false

# Base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pocas conexiones: el plan gratis de la base tiene un límite bajo
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# CORS: la URL del front en Vercel (más las previews)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging.level.root=INFO
logging.level.app=INFO
